name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main, master, vitepress]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install and build
        run: |
          cd docs
          npm ci
          npm run docs:build

      # Project Pages maps artifact root → https://eniac-tech.github.io/<repo>/
      # Nest dist under flexbar/ so the site matches base /FlexDocumentation/flexbar/
      - name: Layout Pages artifact (flexbar subdirectory)
        run: |
          mkdir -p _pages
          mv docs/.vitepress/dist _pages/flexbar
          printf '%s\n' '<!DOCTYPE html>' '<html lang="en"><head><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=flexbar/en/">' \
            '<meta name="viewport" content="width=device-width,initial-scale=1">' \
            '<title>FlexDocumentation</title></head><body>' \
            '<p><a href="flexbar/en/">Continue to documentation</a></p>' \
            '</body></html>' > _pages/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
